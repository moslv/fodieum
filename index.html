
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Fodium — billetterie et navettes événementielles au Sénégal. Un seul pass pour le billet et le transport."
    />
    <meta name="theme-color" content="#F07E00" />
    <title>Fodium — Billetterie & Transport</title>

    <!--
      Le thème est posé avant le premier rendu : chargé par React, il ferait
      apparaître la page en clair avant de virer au sombre. La clé est la même
      que celle de `src/lib/theme.ts`.
    -->
    <script>
      try {
        var stored = localStorage.getItem('fodium.theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {
        // Stockage bloqué : la page s'affiche en clair, ce qui reste correct.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
